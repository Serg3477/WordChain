server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    # Проксирование корневых API-запросов (/guest, /login, /me и т.д.)
    location ~ ^/(guest|login|me|register|delete|translate|saveWord)($|/) {
        proxy_pass http://wordchain-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
