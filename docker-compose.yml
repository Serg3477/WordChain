services:
  db:
    image: postgres:16-alpine
    container_name: wordchain-db
    environment:
      POSTGRES_DB: wordchain
      POSTGRES_USER: wordchain_user
      POSTGRES_PASSWORD: wordchain_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: wordchain-backend
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: wordchain-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata: